<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes, viewport-fit=cover">
    <title>Ledger 1985 · Goal Forge</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: radial-gradient(circle at 20% 30%, #1a2a1a, #0a120a);
            font-family: 'Courier New', 'Fira Code', 'VT323', monospace;
            padding: 16px 12px 40px;
            min-height: 100vh;
        }
        .crt {
            max-width: 800px;
            margin: 0 auto;
            background: #1e1e1e;
            border-radius: 32px 32px 28px 28px;
            box-shadow: 0 16px 32px rgba(0,0,0,0.6), inset 0 1px 0px rgba(255,255,255,0.06);
            border: 1px solid #2c3e2c;
        }
        .window-header {
            background: #2a2a2a;
            padding: 12px 18px;
            border-radius: 32px 32px 0 0;
            border-bottom: 2px solid #3c6e3c;
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 8px;
        }
        .title { font-weight: bold; letter-spacing: 1.5px; font-size: 1.2rem; color: #8bcb8b; text-shadow: 0 0 3px #1f9a1f; }
        .sync-indicator { font-size: 10px; background: #0f0f0f; padding: 4px 10px; border-radius: 40px; color: #7ab87a; font-family: monospace; cursor: pointer; border: 1px solid #3e6e3e; }
        .content { padding: 20px 18px 26px; }
        .panel { background: #0e1a0e; border: 1px solid #2b5e2b; border-radius: 24px; padding: 18px 16px; margin-bottom: 28px; box-shadow: inset 0 0 8px #1f3a1f, 0 2px 4px rgba(0,0,0,0.4); }
        .panel h2 { font-size: 1.2rem; letter-spacing: 1px; color: #b3f7b3; border-left: 4px solid #6bc86b; padding-left: 12px; margin-bottom: 18px; }
        .budget-row { display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 12px; align-items: center; background: #071007; padding: 8px 12px; border-radius: 60px; }
        .budget-row label { flex: 2; min-width: 100px; font-size: 0.85rem; font-weight: bold; color: #9dcf9d; }
        .budget-row input { flex: 3; background: #030903; border: 1px solid #3c6e3c; padding: 10px 12px; font-family: monospace; font-size: 1rem; color: #d2ffd2; border-radius: 40px; outline: none; }
        .expense-item { display: flex; gap: 8px; margin-bottom: 8px; align-items: center; flex-wrap: wrap; }
        .expense-name { flex: 2; background: #0d170d; border: 1px solid #2f582f; padding: 8px 12px; border-radius: 40px; color: #add8ad; font-family: monospace; }
        .expense-amount { flex: 1; background: #030903; border: 1px solid #3e6b3e; padding: 8px 12px; border-radius: 40px; color: #e2ffe2; font-family: monospace; }
        .remove-expense { background: #2e1e1e; border: none; color: #ffa0a0; font-weight: bold; width: 36px; border-radius: 60px; cursor: pointer; font-size: 1.2rem; }
        .add-btn { background: #1f3a1f; border: 1px solid #5ba05b; padding: 8px 18px; border-radius: 60px; font-family: monospace; font-weight: bold; color: #bef5be; margin-top: 12px; width: fit-content; cursor: pointer; }
        .add-btn:active { transform: scale(0.97); background: #2f552f; }
        .new-month-btn { background: #5a4a2a; border: 1px solid #b8a86a; color: #f5e6b0; }
        .goal-money-card { background: #102010; border-radius: 40px; padding: 12px 18px; text-align: center; margin: 18px 0 8px; }
        .goal-money-number { font-size: 2.2rem; font-weight: bold; color: #e6ffe6; letter-spacing: 2px; }
        .goals-list { margin-top: 20px; display: flex; flex-direction: column; gap: 20px; }
        .goal-card { background: #0f1a0f; border-radius: 28px; border-left: 8px solid #7bc97b; padding: 14px 16px; transition: all 0.1s; }
        .goal-header { display: flex; justify-content: space-between; flex-wrap: wrap; align-items: baseline; margin-bottom: 8px; gap: 8px; }
        .goal-name { font-weight: bold; font-size: 1rem; background: #071007; border: 1px solid #2f582f; padding: 6px 12px; border-radius: 60px; color: #d0ffd0; font-family: monospace; flex: 2; }
        .goal-target-edit { background: #071007; border: 1px solid #3c723c; padding: 6px 10px; border-radius: 40px; color: #f0fff0; width: 110px; font-family: monospace; text-align: center; }
        .progress-bar-bg { background: #1d2a1d; border-radius: 60px; height: 18px; margin: 10px 0; overflow: hidden; }
        .progress-fill { background: #6bd96b; width: 0%; height: 100%; border-radius: 60px; }
        .goal-stats { display: flex; flex-wrap: wrap; gap: 14px; font-size: 0.75rem; color: #b1d0b1; margin: 8px 0; }
        .goal-input-group { display: flex; flex-wrap: wrap; gap: 8px; margin: 12px 0 6px; align-items: center; }
        .contribution-input { background: #030d03; border: 1px solid #477a47; padding: 8px 10px; border-radius: 60px; color: #ceffce; font-family: monospace; flex: 1; }
        .small-btn { background: #2b472b; border: none; border-radius: 60px; padding: 6px 14px; font-family: monospace; font-weight: bold; color: #bcfdbc; cursor: pointer; }
        .delete-goal { background: #3e2626; color: #ffb4b4; border: none; border-radius: 60px; padding: 6px 14px; cursor: pointer; }
        .move-btn { background: #2a4a6e; border: none; border-radius: 60px; padding: 4px 12px; font-family: monospace; font-size: 0.8rem; color: #b7f0f0; cursor: pointer; }
        .notes-toggle { background: #1f2a1f; border: none; border-radius: 60px; padding: 4px 12px; font-size: 0.7rem; color: #bada8a; cursor: pointer; width: fit-content; }
        .notes-area { margin-top: 8px; background: #092009; border-radius: 20px; padding: 8px 12px; display: none; }
        .notes-area textarea { width: 100%; background: #030f03; border: 1px solid #4f7a4f; color: #cef5ce; font-family: monospace; padding: 8px; border-radius: 20px; font-size: 0.7rem; resize: vertical; }
        .action-bar { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 12px; margin-top: 12px; }
        .reset-btn { background: #2a2a2a; border: 1px solid #9e6e6e; color: #f0b3b3; }
        .export-btn { background: #1a2e3a; border: 1px solid #6f9f9f; color: #b7f0f0; }
        .copy-btn { background: #2a4a2a; border: 1px solid #6f9f6f; color: #b7f0b7; }
        .archive-panel { background: #0a120a; border-radius: 24px; padding: 16px; margin-top: 20px; }
        .archive-title { color: #8bcb8b; font-size: 0.9rem; margin-bottom: 12px; border-left: 3px solid #6bc86b; padding-left: 10px; }
        .archive-list { display: flex; flex-direction: column; gap: 8px; max-height: 200px; overflow-y: auto; }
        .archive-item { background: #142014; border-radius: 40px; padding: 8px 14px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 8px; }
        .archive-month { color: #add8ad; font-family: monospace; cursor: pointer; }
        .archive-month:hover { color: #d4ffd4; text-decoration: underline; }
        .archive-export { background: #1a2e3a; border: none; border-radius: 40px; padding: 4px 12px; color: #b7f0f0; cursor: pointer; font-size: 0.7rem; }
        .archive-delete { background: #3e2626; border: none; border-radius: 40px; padding: 4px 12px; color: #ffb4b4; cursor: pointer; font-size: 0.7rem; }
        .view-mode-badge { background: #2a4a2a; border-radius: 40px; padding: 4px 12px; font-size: 0.7rem; color: #b3f7b3; margin-bottom: 12px; display: inline-block; }
        .reorder-buttons { display: flex; gap: 6px; align-items: center; }
        .toast-msg { position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%); background: #2a5a2a; color: #d4ffd4; padding: 8px 20px; border-radius: 60px; font-size: 0.8rem; z-index: 1000; box-shadow: 0 2px 8px black; pointer-events: none; }
        footer { font-size: 0.65rem; text-align: center; margin-top: 20px; color: #5d895d; }
        @media (max-width: 540px) { .content { padding: 12px; } .goal-input-group { flex-direction: column; align-items: stretch; } .goal-header { flex-direction: column; } }
    </style>
</head>
<body>
<div class="crt">
    <div class="window-header">
        <div class="title">◍ LEDGER 1985 ◍</div>
        <div class="sync-indicator" id="syncStatusChip">☁️ SYNC READY</div>
    </div>
    <div class="content">
        <div class="panel">
            <h2>💰 CASH IN / OUT</h2>
            <div class="budget-row">
                <label>💷 MONTHLY INCOME (net)</label>
                <input type="number" id="monthlyIncome" placeholder="0.00" step="any" value="0">
            </div>
            <div style="margin: 8px 0 4px;"><span style="color:#9fca9f;">▼ EXPENSES (rent, food, bills)</span></div>
            <div id="expensesContainer"></div>
            <button class="add-btn" id="addExpenseBtn">+ ADD EXPENSE</button>
            <div class="goal-money-card">
                <div style="font-size: 0.8rem; color:#b3f7b3;">💰 MONEY FOR GOALS</div>
                <div class="goal-money-number" id="goalMoneyDisplay">£0.00</div>
                <div style="font-size: 0.7rem; color:#b3f7b3;">after rent & essentials</div>
            </div>
        </div>

        <div class="panel">
            <h2>🎯 GOALS · FOCUS <span id="currentMonthDisplay" style="font-size:0.7rem;"></span></h2>
            <div id="viewModeBadge" class="view-mode-badge" style="display:none;">📖 VIEWING ARCHIVE</div>
            <div id="goalsListContainer" class="goals-list"></div>
            <div class="action-bar">
                <button class="add-btn" id="addGoalBtn">✨ + NEW GOAL</button>
                <button class="add-btn copy-btn" id="copyToClipboardBtn">📋 COPY TO CLIPBOARD</button>
                <button class="add-btn export-btn" id="exportJSONBtn">💾 SAVE BACKUP (JSON)</button>
                <button class="add-btn new-month-btn" id="newMonthBtn">📆 START NEW MONTH</button>
                <button class="add-btn reset-btn" id="resetAllBtn">⟳ RESET ALL</button>
            </div>
        </div>

        <div class="archive-panel">
            <div class="archive-title">📁 MONTHLY ARCHIVE</div>
            <div id="archiveList" class="archive-list"></div>
            <div style="margin-top: 10px;">
                <button id="saveCurrentMonthBtn" class="small-btn" style="background:#2f552f;">💾 SNAPSHOT CURRENT MONTH</button>
                <button id="exitArchiveBtn" class="small-btn" style="display:none; background:#5a4a2a;">✖️ BACK TO CURRENT</button>
            </div>
        </div>
        <footer>📆 START NEW MONTH → choose: keep goals or fresh start · ⬆️⬇️ reorder goals</footer>
    </div>
</div>

<div id="syncModal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#071007dd; backdrop-filter: blur(3px); justify-content:center; align-items:center; z-index:1000;">
    <div style="background:#121e12; max-width:360px; width:90%; border-radius:32px; border:1px solid #578b57; padding:22px;">
        <h3 style="color:#b1f0b1;">☁️ CLOUD SYNC</h3>
        <label style="color:#97cf97;">GitHub Token</label>
        <input type="password" id="modalToken" style="width:100%; margin:8px 0; background:#030903; border:1px solid #3e7e3e; padding:8px; color:#d6ffd6;">
        <label style="color:#97cf97;">Gist ID</label>
        <input type="text" id="modalGistId" style="width:100%; margin:8px 0; background:#030903; border:1px solid #3e7e3e; padding:8px; color:#d6ffd6;">
        <div style="display:flex; gap:12px; margin-top: 16px;">
            <button id="saveGistSettingsBtn" style="background:#2d592d; border:none; padding:8px; border-radius:60px; color:white; flex:1;">SAVE & SYNC</button>
            <button id="closeSyncModalBtn" style="background:#2e2e2e; border:none; flex:1; border-radius:60px;">CANCEL</button>
        </div>
    </div>
</div>

<script>
    // ========== DATA ==========
    let monthlyIncome = 0;
    let expenses = [];
    let goals = [];
    let monthlyArchive = {};
    let currentViewArchive = null;
    
    let githubToken = localStorage.getItem('goal_github_token') || '';
    let gistId = localStorage.getItem('goal_gist_id') || '';
    let syncInProgress = false;

    const incomeInput = document.getElementById('monthlyIncome');
    const expensesContainer = document.getElementById('expensesContainer');
    const goalsContainer = document.getElementById('goalsListContainer');
    const goalMoneySpan = document.getElementById('goalMoneyDisplay');
    const syncStatusSpan = document.getElementById('syncStatusChip');
    const archiveListDiv = document.getElementById('archiveList');

    function getCurrentYearMonth() { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}`; }
    function calculateGoalMoney() {
        let totalExpenses = expenses.reduce((sum, e) => sum + (parseFloat(e.amount) || 0), 0);
        let incomeVal = parseFloat(monthlyIncome) || 0;
        return incomeVal - totalExpenses > 0 ? incomeVal - totalExpenses : 0;
    }
    function updateGoalMoneyDisplay() { goalMoneySpan.innerText = `£${calculateGoalMoney().toFixed(2)}`; }
    function showToast(msg) { let d = document.createElement('div'); d.className = 'toast-msg'; d.innerText = msg; document.body.appendChild(d); setTimeout(() => d.remove(), 2000); }
    
    function persistAll() {
        if (currentViewArchive) return;
        localStorage.setItem('ledger1985_final', JSON.stringify({ monthlyIncome, expenses, goals: goals.map(g => ({ ...g })) }));
        localStorage.setItem('ledger1985_archive', JSON.stringify(monthlyArchive));
        triggerGistBackup();
    }

    function seedDefaultGoals() {
        goals = [
            { id: 'ship1', name: '🚢 SHIP STUFF FROM US', targetAmount: 1200, currentSaved: 0, targetDate: '2025-12-01', orderIndex: 0, userMonthlyContribution: 0, note: '' },
            { id: 'chair', name: '💺 OFFICE CHAIR', targetAmount: 150, currentSaved: 0, targetDate: '', orderIndex: 1, userMonthlyContribution: 0, note: '' },
            { id: 'taxes', name: '📋 TAXES (DEBT)', targetAmount: 500, currentSaved: 0, targetDate: '2026-01-15', orderIndex: 2, userMonthlyContribution: 0, note: '' },
            { id: 'electric', name: '⚡ ELECTRIC DEBT', targetAmount: 1000, currentSaved: 0, targetDate: '', orderIndex: 3, userMonthlyContribution: 0, note: '' }
        ];
    }

    function loadFromLocal() {
        const saved = localStorage.getItem('ledger1985_final');
        const savedArchive = localStorage.getItem('ledger1985_archive');
        if (savedArchive) monthlyArchive = JSON.parse(savedArchive);
        if (saved) {
            const data = JSON.parse(saved);
            monthlyIncome = data.monthlyIncome || 0;
            expenses = data.expenses || [];
            goals = data.goals || [];
            goals.forEach(g => { if (g.note === undefined) g.note = ''; if (g.orderIndex === undefined) g.orderIndex = 0; });
            expenses.forEach(e => { if (e.note === undefined) e.note = ''; });
            goals.sort((a,b) => (a.orderIndex||0) - (b.orderIndex||0));
            incomeInput.value = monthlyIncome;
        }
        if (goals.length === 0) seedDefaultGoals();
        checkMonthRollover();
        renderExpenses();
        renderGoals();
        updateGoalMoneyDisplay();
        renderArchiveList();
    }

    function checkMonthRollover() {
        const lastMonth = localStorage.getItem('ledger1985_last_month');
        const currentMonth = getCurrentYearMonth();
        if (lastMonth && lastMonth !== currentMonth) {
            monthlyArchive[lastMonth] = { monthlyIncome, expenses: JSON.parse(JSON.stringify(expenses)), goals: JSON.parse(JSON.stringify(goals)), archivedDate: new Date().toISOString() };
            persistAll();
        }
        localStorage.setItem('ledger1985_last_month', currentMonth);
        document.getElementById('currentMonthDisplay').innerText = `(${currentMonth})`;
    }

    // ========== START NEW MONTH WITH CHOICE ==========
    function startNewMonth() {
        // Create custom confirm with options
        const choice = confirm("📆 START NEW MONTH\n\nChoose:\n• OK = Keep goals (with progress), reset income & expenses\n• Cancel = Start completely fresh (everything resets)");
        
        // Archive current month first (always archive before resetting)
        const currentMonth = getCurrentYearMonth();
        monthlyArchive[currentMonth] = { 
            monthlyIncome: monthlyIncome, 
            expenses: JSON.parse(JSON.stringify(expenses)), 
            goals: JSON.parse(JSON.stringify(goals)), 
            archivedDate: new Date().toISOString() 
        };
        
        if (choice === true) {
            // OK = Keep goals with progress, reset income + expenses
            monthlyIncome = 0;
            expenses = [];
            // goals remain exactly as they are (with currentSaved progress kept)
            goals.forEach(g => {
                g.userMonthlyContribution = 0; // reset monthly contribution tracking
            });
            showToast("✅ New month started. Goals kept with progress. Income + expenses reset.");
        } else {
            // Cancel = Fresh start (everything reset)
            monthlyIncome = 0;
            expenses = [];
            seedDefaultGoals();
            showToast("✨ Fresh start! All goals, income, and expenses reset.");
        }
        
        incomeInput.value = 0;
        localStorage.setItem('ledger1985_last_month', currentMonth);
        persistAll();
        renderExpenses();
        renderGoals();
        updateGoalMoneyDisplay();
        renderArchiveList();
    }

    function saveSnapshotToArchive(monthKey) {
        if (!monthKey) monthKey = getCurrentYearMonth();
        monthlyArchive[monthKey] = { monthlyIncome, expenses: JSON.parse(JSON.stringify(expenses)), goals: JSON.parse(JSON.stringify(goals)), archivedDate: new Date().toISOString() };
        persistAll();
        renderArchiveList();
        showToast(`Snapshot saved for ${monthKey}`);
    }

    function exitArchiveMode() {
        currentViewArchive = null;
        loadFromLocal();
        document.getElementById('viewModeBadge').style.display = 'none';
        document.getElementById('exitArchiveBtn').style.display = 'none';
    }

    // ========== REORDER FUNCTIONS ==========
    function moveGoalUp(index) {
        if (index <= 0) return;
        [goals[index-1], goals[index]] = [goals[index], goals[index-1]];
        goals.forEach((g, i) => g.orderIndex = i);
        persistAll();
        renderGoals();
    }
    function moveGoalDown(index) {
        if (index >= goals.length - 1) return;
        [goals[index+1], goals[index]] = [goals[index], goals[index+1]];
        goals.forEach((g, i) => g.orderIndex = i);
        persistAll();
        renderGoals();
    }

    // ========== COPY TO CLIPBOARD ==========
    function copyToClipboard() {
        let text = `LEDGER REPORT - ${getCurrentYearMonth()}\n`;
        text += `=================================\n`;
        text += `INCOME: £${monthlyIncome}\n\n`;
        text += `EXPENSES:\n`;
        expenses.forEach(e => text += `  ${e.name}: £${e.amount}\n`);
        text += `\nGOALS (priority order):\n`;
        goals.forEach((g, i) => text += `  ${i+1}. ${g.name}: £${g.currentSaved} / £${g.targetAmount} (${Math.round((g.currentSaved/g.targetAmount)*100)}%)\n`);
        text += `\nMONEY FOR GOALS: £${calculateGoalMoney()}\n`;
        navigator.clipboard.writeText(text).then(() => showToast("✓ Copied! Paste into spreadsheet or document")).catch(() => alert("Manual copy: select all text"));
    }

    function exportJSON() {
        const data = { monthlyIncome, expenses, goals, exportDate: new Date().toISOString() };
        const blob = new Blob([JSON.stringify(data, null, 2)], {type: 'application/json'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `ledger_backup_${getCurrentYearMonth()}.json`;
        a.click();
        URL.revokeObjectURL(blob.href);
        showToast("✓ JSON backup saved");
    }

    function exportArchiveJSON(monthKey) {
        const snap = monthlyArchive[monthKey];
        if (!snap) return;
        const blob = new Blob([JSON.stringify(snap, null, 2)], {type: 'application/json'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = `ledger_${monthKey}.json`;
        a.click();
        URL.revokeObjectURL(blob.href);
        showToast(`✓ Archive ${monthKey} saved`);
    }

    // ========== RENDER FUNCTIONS ==========
    function renderExpenses() {
        expensesContainer.innerHTML = '';
        if (expenses.length === 0) { expensesContainer.innerHTML = '<div style="color:#6b8f6b; padding:8px;">➕ add rent, food, transport…</div>'; return; }
        expenses.forEach((exp, idx) => {
            const row = document.createElement('div');
            row.className = 'expense-item';
            row.innerHTML = `
                <input type="text" class="expense-name" value="${escapeHtml(exp.name)}" data-idx="${idx}" ${currentViewArchive ? 'disabled' : ''}>
                <input type="number" step="any" class="expense-amount" value="${exp.amount}" data-idx="${idx}" ${currentViewArchive ? 'disabled' : ''}>
                <button class="remove-expense" data-idx="${idx}" ${currentViewArchive ? 'disabled' : ''}>✕</button>
                <button class="notes-toggle expense-note-toggle" data-idx="${idx}">📝 note</button>
                <div class="notes-area expense-notes-${idx}" style="width:100%;"><textarea rows="2" ${currentViewArchive ? 'disabled' : ''}>${escapeHtml(exp.note || '')}</textarea></div>
            `;
            expensesContainer.appendChild(row);
        });
        attachExpenseEvents();
    }

    function attachExpenseEvents() {
        document.querySelectorAll('.expense-name').forEach(inp => { inp.onchange = () => { if(!currentViewArchive) { expenses[inp.dataset.idx].name = inp.value; persistAll(); updateGoalMoneyDisplay(); } }; });
        document.querySelectorAll('.expense-amount').forEach(inp => { inp.oninput = () => { if(!currentViewArchive) { expenses[inp.dataset.idx].amount = parseFloat(inp.value) || 0; persistAll(); updateGoalMoneyDisplay(); } }; });
        document.querySelectorAll('.remove-expense').forEach(btn => { btn.onclick = () => { if(!currentViewArchive) { expenses.splice(parseInt(btn.dataset.idx),1); renderExpenses(); persistAll(); updateGoalMoneyDisplay(); } }; });
        document.querySelectorAll('.expense-note-toggle').forEach(btn => { btn.onclick = () => { const div = document.querySelector(`.expense-notes-${btn.dataset.idx}`); if(div) div.style.display = div.style.display === 'none' ? 'block' : 'none'; }; });
        document.querySelectorAll('.notes-area textarea').forEach((ta, idx) => { ta.onblur = () => { if(!currentViewArchive && expenses[idx]) expenses[idx].note = ta.value; persistAll(); }; });
    }

    function monthsUntilDate(dateStr) { if (!dateStr) return 0; let target = new Date(dateStr); let now = new Date(); return (target.getFullYear() - now.getFullYear()) * 12 + (target.getMonth() - now.getMonth()); }
    function computeProjection(goal, monthlyContribution) {
        const remaining = goal.targetAmount - goal.currentSaved;
        if (remaining <= 0) return { message: '✓ GOAL ACHIEVED!' };
        if (monthlyContribution <= 0) return { message: '➕ add contribution this month' };
        let monthsNeeded = remaining / monthlyContribution;
        let projectionDate = new Date(); projectionDate.setMonth(projectionDate.getMonth() + Math.ceil(monthsNeeded));
        let formatted = projectionDate.toLocaleDateString('en-GB', { year:'numeric', month:'short' });
        if (goal.targetDate && goal.targetDate !== '') {
            let monthsUntilDeadline = monthsUntilDate(goal.targetDate);
            if (monthsUntilDeadline > 0) {
                let requiredMonthly = remaining / monthsUntilDeadline;
                if (monthlyContribution >= requiredMonthly - 0.01) return { message: `✅ on track · finish by ${formatted}` };
                else return { message: `⚠️ behind: +£${(requiredMonthly - monthlyContribution).toFixed(2)}/mo needed` };
            }
        }
        return { message: `📅 est. ${formatted}` };
    }

    function renderGoals() {
        goalsContainer.innerHTML = '';
        if (goals.length === 0) { goalsContainer.innerHTML = '<div style="color:#7ba07b; text-align:center; padding:20px;">✨ click +NEW GOAL</div>'; return; }
        goals.forEach((goal, idx) => {
            const percent = goal.targetAmount > 0 ? (goal.currentSaved / goal.targetAmount) * 100 : 0;
            const monthlyContribution = goal.userMonthlyContribution || 0;
            const projection = computeProjection(goal, monthlyContribution);
            const deadlineInfo = goal.targetDate ? `<span style="color:#b3f7b3;">📅 deadline: ${goal.targetDate}</span>` : `<span style="color:#e6c87a;">⚡ asap mode</span>`;
            const neededPerMonth = (goal.targetAmount && goal.targetDate) ? ((goal.targetAmount - goal.currentSaved) / Math.max(1, monthsUntilDate(goal.targetDate))).toFixed(2) : '—';
            const canMoveUp = idx > 0 && !currentViewArchive;
            const canMoveDown = idx < goals.length - 1 && !currentViewArchive;
            const card = document.createElement('div');
            card.className = 'goal-card';
            card.setAttribute('data-id', goal.id);
            card.innerHTML = `
                <div class="goal-header">
                    <input type="text" class="goal-name" value="${escapeHtml(goal.name)}" data-id="${goal.id}" ${currentViewArchive ? 'disabled' : ''}>
                    <input type="number" step="any" class="goal-target-edit" value="${goal.targetAmount}" data-id="${goal.id}" ${currentViewArchive ? 'disabled' : ''}>
                    <div class="goal-badge" style="color:#b3f7b3;">🎯 saved: £${goal.currentSaved.toFixed(2)}</div>
                </div>
                <div class="progress-bar-bg"><div class="progress-fill" style="width:${Math.min(100,percent)}%;"></div></div>
                <div class="goal-stats"><span>💰 left: £${(goal.targetAmount - goal.currentSaved).toFixed(2)}</span><span>🏁 target: £${goal.targetAmount}</span></div>
                <div class="goal-input-group">
                    <input type="number" step="any" placeholder="this month's contribution (£)" class="contribution-input" data-id="${goal.id}" value="${monthlyContribution > 0 ? monthlyContribution : ''}" ${currentViewArchive ? 'disabled' : ''}>
                    <button class="small-btn apply-contrib" data-id="${goal.id}" ${currentViewArchive ? 'disabled' : ''}>APPLY ➕</button>
                    <button class="delete-goal" data-id="${goal.id}" ${currentViewArchive ? 'disabled' : ''}>🗑️ DELETE</button>
                    <button class="notes-toggle goal-note-toggle" data-id="${goal.id}">📝 note</button>
                </div>
                <div class="reorder-buttons" style="margin-top: 8px; gap: 8px;">
                    ${!currentViewArchive ? `<button class="move-btn move-up" data-idx="${idx}" ${!canMoveUp ? 'disabled style="opacity:0.3;"' : ''}>⬆️ Up</button>` : ''}
                    ${!currentViewArchive ? `<button class="move-btn move-down" data-idx="${idx}" ${!canMoveDown ? 'disabled style="opacity:0.3;"' : ''}>⬇️ Down</button>` : ''}
                </div>
                <div id="goalNote_${goal.id}" class="notes-area" style="display:none;"><textarea rows="2" ${currentViewArchive ? 'disabled' : ''}>${escapeHtml(goal.note || '')}</textarea></div>
                <div style="font-size:0.75rem; margin:6px 0 0; color:#ade6ad;">${projection.message}</div>
                <div style="font-size:0.7rem; display:flex; justify-content:space-between; flex-wrap:wrap;">${deadlineInfo}<span style="color:#9fca9f;">💷 need/mo: £${neededPerMonth}</span></div>
            `;
            goalsContainer.appendChild(card);
        });
        if(!currentViewArchive) attachGoalEvents();
    }

    function attachGoalEvents() {
        document.querySelectorAll('.goal-name').forEach(inp => { inp.onchange = () => { const g = goals.find(g=>g.id===inp.dataset.id); if(g) g.name = inp.value; persistAll(); renderGoals(); }; });
        document.querySelectorAll('.goal-target-edit').forEach(inp => { inp.onchange = () => { const g = goals.find(g=>g.id===inp.dataset.id); if(g) { let nt = parseFloat(inp.value); if(!isNaN(nt) && nt>=0) g.targetAmount = nt; persistAll(); renderGoals(); } }; });
        document.querySelectorAll('.apply-contrib').forEach(btn => { btn.onclick = () => { if(currentViewArchive) return; const goal = goals.find(g=>g.id===btn.dataset.id); if(!goal) return; const contribField = btn.closest('.goal-card').querySelector('.contribution-input'); let amount = parseFloat(contribField.value); if(isNaN(amount)||amount<=0) amount=0; const available = calculateGoalMoney(); if(amount>available && amount>0) { alert(`⚠️ Only £${available.toFixed(2)} available`); return; } if(amount>0) { goal.currentSaved += amount; goal.userMonthlyContribution = amount; persistAll(); } renderGoals(); updateGoalMoneyDisplay(); }; });
        document.querySelectorAll('.delete-goal').forEach(btn => { btn.onclick = () => { if(!currentViewArchive) { goals = goals.filter(g=>g.id!==btn.dataset.id); persistAll(); renderGoals(); } }; });
        document.querySelectorAll('.goal-note-toggle').forEach(btn => { btn.onclick = () => { const div = document.getElementById(`goalNote_${btn.dataset.id}`); if(div) div.style.display = div.style.display === 'none' ? 'block' : 'none'; }; });
        document.querySelectorAll('.notes-area textarea').forEach(ta => { ta.onblur = () => { if(!currentViewArchive) { const parentId = ta.closest('.notes-area').id; const goalId = parentId.replace('goalNote_',''); const goal = goals.find(g=>g.id===goalId); if(goal) goal.note = ta.value; persistAll(); } }; });
        document.querySelectorAll('.move-up').forEach(btn => { btn.onclick = () => { if(!currentViewArchive) moveGoalUp(parseInt(btn.dataset.idx)); }; });
        document.querySelectorAll('.move-down').forEach(btn => { btn.onclick = () => { if(!currentViewArchive) moveGoalDown(parseInt(btn.dataset.idx)); }; });
    }

    function renderArchiveList() {
        if (!archiveListDiv) return;
        const months = Object.keys(monthlyArchive).sort().reverse();
        if (months.length === 0) { archiveListDiv.innerHTML = '<div style="color:#6b8f6b; padding:8px;">No archived months. Click "Snapshot" or start a new month.</div>'; return; }
        archiveListDiv.innerHTML = months.map(m => `
            <div class="archive-item">
                <span class="archive-month" data-month="${m}">📅 ${m.replace('-', ' · ')}</span>
                <div><button class="archive-export" data-month="${m}">📎 JSON</button><button class="archive-delete" data-month="${m}">🗑️</button></div>
            </div>
        `).join('');
        document.querySelectorAll('.archive-month').forEach(el => { el.addEventListener('click', () => { loadArchiveIntoView(el.dataset.month); }); });
        document.querySelectorAll('.archive-export').forEach(btn => { btn.addEventListener('click', (e) => { e.stopPropagation(); exportArchiveJSON(btn.dataset.month); }); });
        document.querySelectorAll('.archive-delete').forEach(btn => { btn.addEventListener('click', (e) => { e.stopPropagation(); if(confirm('Delete archive?')) { delete monthlyArchive[btn.dataset.month]; persistAll(); renderArchiveList(); if(currentViewArchive === btn.dataset.month) exitArchiveMode(); } }); });
    }

    function loadArchiveIntoView(monthKey) {
        const snap = monthlyArchive[monthKey];
        if (!snap) return;
        currentViewArchive = monthKey;
        monthlyIncome = snap.monthlyIncome;
        expenses = snap.expenses;
        goals = snap.goals;
        incomeInput.value = monthlyIncome;
        renderExpenses(); renderGoals(); updateGoalMoneyDisplay();
        document.getElementById('viewModeBadge').style.display = 'inline-block';
        document.getElementById('exitArchiveBtn').style.display = 'inline-block';
    }

    function hardReset() { if(confirm("⚠️ DELETE ALL DATA? This cannot be undone.")) { localStorage.clear(); location.reload(); } }

    async function triggerGistBackup() { if(!githubToken||!gistId||syncInProgress) return; syncInProgress=true; syncStatusSpan.innerText='☁️ SYNC...'; try { const getRes=await fetch(`https://api.github.com/gists/${gistId}`,{headers:{'Authorization':`token ${githubToken}`}}); let existing={}; if(getRes.ok){ const gistData=await getRes.json(); const content=gistData.files['ledger1985.json']?.content; if(content) existing=JSON.parse(content); } existing.ledger={ monthlyIncome, expenses, goals, archive: monthlyArchive, lastSync:new Date().toISOString() }; await fetch(`https://api.github.com/gists/${gistId}`,{method:'PATCH',headers:{'Authorization':`token ${githubToken}`,'Content-Type':'application/json'},body:JSON.stringify({files:{'ledger1985.json':{content:JSON.stringify(existing,null,2)}}})}); syncStatusSpan.innerText='☁️ SYNC OK'; setTimeout(()=>syncStatusSpan.innerText='☁️ SYNC READY',2000); } catch(e){ syncStatusSpan.innerText='⚠️ SYNC ERR'; } finally { syncInProgress=false; } }
    async function loadFromGist() { if(!githubToken||!gistId) return; syncStatusSpan.innerText='📡 LOAD...'; try { const res=await fetch(`https://api.github.com/gists/${gistId}`,{headers:{'Authorization':`token ${githubToken}`}}); if(res.ok){ const gist=await res.json(); const content=gist.files['ledger1985.json']?.content; if(content){ const remote=JSON.parse(content); if(remote.ledger){ monthlyIncome=remote.ledger.monthlyIncome||0; expenses=remote.ledger.expenses||[]; goals=remote.ledger.goals||[]; monthlyArchive=remote.ledger.archive||{}; incomeInput.value=monthlyIncome; renderExpenses(); renderGoals(); updateGoalMoneyDisplay(); renderArchiveList(); persistAll(); syncStatusSpan.innerText='☁️ LOADED'; setTimeout(()=>syncStatusSpan.innerText='☁️ SYNC READY',1800); } } } } catch(e){} }
    function escapeHtml(str) { return String(str).replace(/[&<>]/g, m => ({ '&':'&amp;','<':'&lt;','>':'&gt;' }[m])); }

    // ========== BUTTON BINDINGS ==========
    document.getElementById('addExpenseBtn').onclick = () => { if(!currentViewArchive) { expenses.push({ name: 'New expense', amount: 0, note: '' }); renderExpenses(); persistAll(); updateGoalMoneyDisplay(); } };
    document.getElementById('addGoalBtn').onclick = () => { if(!currentViewArchive) { goals.push({ id:'goal_'+Date.now(), name:'✨ New Goal', targetAmount:200, currentSaved:0, targetDate:'', orderIndex:goals.length, userMonthlyContribution:0, note:'' }); persistAll(); renderGoals(); } };
    document.getElementById('copyToClipboardBtn').onclick = copyToClipboard;
    document.getElementById('exportJSONBtn').onclick = exportJSON;
    document.getElementById('newMonthBtn').onclick = startNewMonth;
    document.getElementById('resetAllBtn').onclick = hardReset;
    document.getElementById('saveCurrentMonthBtn').onclick = () => saveSnapshotToArchive(getCurrentYearMonth());
    document.getElementById('exitArchiveBtn').onclick = exitArchiveMode;
    incomeInput.oninput = () => { if(!currentViewArchive) { monthlyIncome = parseFloat(incomeInput.value) || 0; persistAll(); updateGoalMoneyDisplay(); renderGoals(); } };
    document.getElementById('syncStatusChip').onclick = () => document.getElementById('syncModal').style.display = 'flex';
    document.getElementById('saveGistSettingsBtn').onclick = async () => { const newToken=document.getElementById('modalToken').value.trim(); const newGist=document.getElementById('modalGistId').value.trim(); if(newToken) { githubToken=newToken; localStorage.setItem('goal_github_token',newToken); } if(newGist) { gistId=newGist; localStorage.setItem('goal_gist_id',newGist); } document.getElementById('syncModal').style.display='none'; await loadFromGist(); };
    document.getElementById('closeSyncModalBtn').onclick = () => document.getElementById('syncModal').style.display='none';
    
    loadFromLocal();
    if(githubToken && gistId) setTimeout(()=>loadFromGist(),300);
</script>
</body>
</html>
